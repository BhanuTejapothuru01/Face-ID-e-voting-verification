services:
  - type: web
    name: facevote-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FACE_DET_SIZE
        value: "320"
      - key: PORT
        value: 10000
      - key: SIMILARITY_THRESHOLD
        value: 0.68
      - key: ADMIN_SECRET
        value: 602142
      - key: CORS_ORIGINS
        value: "*"
